    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-184b80b1-8348.cloud.databricks.com
    variables:
      catalog: project1_dev
      schema: dev
      warehouse_id: 1f14f88dc65f32dd
  prod:
    mode: production
    workspace:
      host: https://dbc-184b80b1-8348.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/adarshss120@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/de_project1
    variables:
      catalog: project1_prod
      schema: prod
      warehouse_id: 1f14f88dc65f32dd
    permissions:
      - user_name: adarshss120@gmail.com
        level: CAN_MANAGE
